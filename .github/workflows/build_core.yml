name: 🧱 Build Core Container (Light Check)

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main
      - feat/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐍 Set up Python (solo para entorno)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Light Build Test (solo validación)
        run: |
          echo "🚧 Iniciando build de validación del contenedor..."
          docker buildx build \
            --progress=plain \
            --load \
            -f docker/core/Dockerfile \
            -t radproc-core:light .
          echo "✅ Build estructural completado correctamente."





