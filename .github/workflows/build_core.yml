name: 🧱 Build Core Container

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main
      - feat/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🐳 Build Docker image (RadProc Core)
        run: |
          echo "🔧 Iniciando build del contenedor radproc-core..."
          docker build --progress=plain --no-cache -f docker/core/Dockerfile -t radproc-core .
          echo "✅ Build finalizado correctamente."

      - name: ✅ Validate build
        run: |
          echo "🧪 Ejecutando validación del contenedor..."
          docker run --rm radproc-core
          echo "✅ Contenedor validado correctamente."


