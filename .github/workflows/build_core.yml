name: 🧱 Build Core Container (Full Build)

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main
      - feat/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐍 Set up Python (solo entorno auxiliar)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🧱 Build full Docker image (RadProc Core)
        run: |
          echo "🚀 Iniciando build completo del contenedor del Core..."
          docker buildx build \
            --progress=plain \
            --load \
            -f docker/core/Dockerfile \
            -t radproc-core:latest .
          echo "✅ Build completo del contenedor del Core finalizado y cargado."


      - name: ✅ Smoke Test (validación básica)
        run: |
          echo "🔍 Probando ejecución mínima del contenedor..."
          docker run --rm radproc-core:latest python -c "print('Core OK!')"
          echo "🟢 Contenedor ejecutado correctamente."






