name: 🧱 Build Core Container (Light Check)

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main
      - feat/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🧱 Docker syntax validation
        run: |
          echo "🔍 Verificando sintaxis del Dockerfile del core..."
          docker buildx bake --print

      - name: ⚙️ Quick build check (no install)
        run: |
          echo "🚧 Ejecución parcial para validar estructura base..."
          docker build --progress=plain --no-cache --target base -f docker/core/Dockerfile -t radproc-core:light .
          echo "✅ Verificación estructural completada."



